server {
    listen 80;
    client_max_body_size 3m;          # uploads are limited to 2 MB

    location / {
        proxy_pass http://frontend:80;
    }
    location /api/auth/         { proxy_pass http://auth-service:8000/; }
    location /api/scholarships/ { proxy_pass http://scholarship-api:8000/; }
    location /api/applications/ { proxy_pass http://application-api:3000/; }
    location /api/uploads/      { proxy_pass http://upload-service:8000/; }
}